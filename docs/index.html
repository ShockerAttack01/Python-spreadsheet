<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Money Tracker</title>
  <style>
    :root { color-scheme:dark; --ink:#f4f0e8; --muted:#9ba39e; --paper:#111312; --card:#1b1e1c; --field:#242825; --accent:#ed684d; --mint:#a8d8c1; --line:#3a403c; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 88% 0%,#4b2b26 0 15rem,transparent 15.1rem),linear-gradient(135deg,#111312,#171a18 55%,#101211); color:var(--ink); font:16px/1.45 Georgia,serif; min-height:100vh; }
    main { width:min(760px,100%); margin:auto; padding:8vh 20px 48px; } header { margin-bottom:28px; } h1 { margin:0; font-size:clamp(2.5rem,10vw,4.8rem); line-height:.95; color:#fffaf2; } .intro { color:var(--muted); margin:14px 0 0; }
    section { background:rgba(27,30,28,.94); border:1px solid var(--line); padding:clamp(20px,5vw,34px); box-shadow:8px 8px 0 #29251e; } form { display:grid; gap:16px; } .fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:grid; gap:6px; min-width:0; font-size:.88rem; color:var(--muted); } input,select { display:block; width:100%; min-width:0; max-width:100%; border:1px solid var(--line); border-radius:3px; padding:13px 12px; background:var(--field); color:var(--ink); font:inherit; } input::placeholder { color:#707872; } input:focus,select:focus { outline:2px solid rgba(168,216,193,.45); border-color:var(--mint); } input[type="date"] { -webkit-appearance:none; appearance:none; display:block; width:100%; min-height:48px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; } button { border:0; border-radius:3px; padding:14px 18px; background:var(--accent); color:#fffaf2; cursor:pointer; font:bold 1rem Georgia,serif; } button:disabled { opacity:.6; } .store-history { margin-top:8px; }
    .status { min-height:1.5em; color:var(--muted); } .success { color:var(--mint); } .error { color:#ff9a83; } .recent { margin-top:36px; } .recent h2 { font-size:1.5rem; margin:0 0 14px; color:#fffaf2; } .purchase { display:flex; justify-content:space-between; gap:18px; border-top:1px solid var(--line); padding:13px 0; } .purchase strong { display:block; color:#fffaf2; } .purchase small { color:var(--muted); } .price { white-space:nowrap; font-weight:bold; color:var(--mint); }
    @media (max-width:520px) { main { padding-top:40px; } .fields { grid-template-columns:1fr; gap:14px; } section { box-shadow:5px 5px 0 #29251e; } input[type="date"] { width:calc(100% - 12px); } }
  </style>
</head>
<body><main><header><h1>Money<br>Tracker</h1><p class="intro">Log a purchase while it is still fresh.</p></header>
  <section><form id="purchase-form"><div class="fields"><label>Date<input name="date" type="date" required></label><label>Amount<input name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required></label></div>
    <div class="fields"><label>What did you buy?<input name="item" autocomplete="off" placeholder="Coffee and sandwich" required></label><label>Store<input name="store" autocomplete="organization" placeholder="Grocery store" required><select id="store-history" class="store-history"><option value="">Previous stores</option></select></label></div><div class="fields"><label>Category<select name="category"><option>General</option><option>Food</option><option>Transport</option><option>Home</option><option>Health</option><option>Fun</option></select></label><label>Notes<input name="notes" autocomplete="off" placeholder="Optional"></label></div>
    <button type="submit">Add purchase</button><div class="status" id="status" role="status"></div></form></section><section class="recent"><h2>Recent purchases</h2><div id="recent-list"><p class="intro">Loading...</p></div></section>
  </main><script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbydnUHEElqkIZW-3RL94Li4Xa0C34RaGN5fdh32hWTdMMT5PMM5IpRlusuEdvAeP0Vi/exec';
    const form = document.querySelector('#purchase-form'), status = document.querySelector('#status'), recentList = document.querySelector('#recent-list');
    const localDate = () => { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; };
    form.date.value = localDate();
    const money = value => Number(value || 0).toLocaleString(undefined, { style: 'currency', currency: 'USD' });
    const escapeHtml = value => { const div = document.createElement('div'); div.textContent = value || ''; return div.innerHTML; };
    function render(rows) { recentList.innerHTML = rows.length ? rows.map(row => `<div class="purchase"><div><strong>${escapeHtml(row.Item)}</strong><small>${escapeHtml(row.Store)} - ${escapeHtml(row.Date)} - ${escapeHtml(row.Time)} - ${escapeHtml(row.Category)}</small></div><span class="price">${money(row.Amount)}</span></div>`).join('') : '<p class="intro">No purchases yet.</p>'; }
    function renderStores(stores) { document.querySelector('#store-history').innerHTML = '<option value="">Previous stores</option>' + (stores || []).map(store => `<option value="${escapeHtml(store)}">${escapeHtml(store)}</option>`).join(''); }
    document.querySelector('#store-history').addEventListener('change', event => { if (event.target.value) form.store.value = event.target.value; event.target.value = ''; });
    function callApi(params) { return new Promise((resolve, reject) => { const callback = `callback${Date.now()}`; const script = document.createElement('script'); window[callback] = data => { delete window[callback]; script.remove(); resolve(data); }; script.onerror = () => reject(new Error('Could not reach the spreadsheet.')); script.src = `${API_URL}?${new URLSearchParams({ ...params, callback })}`; document.body.append(script); }); }
    async function loadRecent() { try { const result = await callApi({}); if (result.error) throw new Error(result.error); render(result.rows); renderStores(result.stores); } catch (error) { recentList.innerHTML = `<p class="intro error">${error.message}</p>`; } }
    form.addEventListener('submit', async event => { event.preventDefault(); const button = form.querySelector('button'); button.disabled = true; status.className = 'status'; status.textContent = 'Adding...'; try { const purchase = Object.fromEntries(new FormData(form)); const result = await callApi({ ...purchase, action: 'add' }); if (result.error) throw new Error(result.error); status.className = 'status success'; status.textContent = 'Purchase added.'; form.reset(); form.date.value = localDate(); loadRecent(); } catch (error) { status.className = 'status error'; status.textContent = error.message; } finally { button.disabled = false; } });
    loadRecent();
  </script>
</body></html>
