<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Money Tracker</title>
  <style>
    :root { color-scheme:dark; --ink:#f4f0e8; --muted:#9ba39e; --paper:#111312; --card:#1b1e1c; --field:#242825; --accent:#ed684d; --mint:#a8d8c1; --line:#3a403c; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 88% 0%,#4b2b26 0 15rem,transparent 15.1rem),linear-gradient(135deg,#111312,#171a18 55%,#101211); color:var(--ink); font:16px/1.45 Georgia,serif; min-height:100vh; }
    main { width:min(1120px,100%); margin:auto; padding:48px 28px 64px; } header { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:28px; } h1 { margin:0; font-size:clamp(2.5rem,8vw,4.8rem); line-height:.95; color:#fffaf2; } .intro { color:var(--muted); margin:14px 0 0; }
    section { background:rgba(27,30,28,.96); border:1px solid var(--line); border-radius:10px; padding:clamp(24px,4vw,42px); box-shadow:10px 10px 0 #29251e; } form { display:grid; gap:20px; } .fields { display:grid; grid-template-columns:1fr 1fr; align-items:start; gap:24px; } .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; } .tab { padding:10px 14px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--muted); font:inherit; cursor:pointer; } .tab.active { background:var(--mint); border-color:var(--mint); color:#15231d; } .view { display:none; } .view.active { display:block; }
    label { display:grid; gap:8px; min-width:0; font-size:.82rem; letter-spacing:.03em; color:var(--muted); } input,select { display:block; width:100%; min-width:0; max-width:100%; min-height:52px; border:1px solid var(--line); border-radius:5px; padding:13px 14px; background:var(--field); color:var(--ink); font:inherit; } input::placeholder { color:#707872; } input:focus,select:focus { outline:2px solid rgba(168,216,193,.45); border-color:var(--mint); } input[type="date"] { -webkit-appearance:none; appearance:none; display:block; width:100%; min-height:52px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; } button { border:0; border-radius:5px; padding:16px 18px; background:var(--accent); color:#fffaf2; cursor:pointer; font:bold 1rem Georgia,serif; } button:disabled { opacity:.6; } .store-history { margin-top:8px; }
    .status { min-height:1.5em; color:var(--muted); } .success { color:var(--mint); } .error { color:#ff9a83; } .recent { margin-top:40px; } .recent h2 { font-size:1.5rem; margin:0 0 14px; color:#fffaf2; } .purchase { display:flex; justify-content:space-between; gap:18px; border-top:1px solid var(--line); padding:15px 0; } .purchase strong { display:block; color:#fffaf2; } .purchase small { color:var(--muted); } .price { white-space:nowrap; font-weight:bold; color:var(--mint); } .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; } .metric { padding:18px; border:1px solid var(--line); border-radius:6px; background:var(--field); } .metric span { display:block; color:var(--muted); font-size:.78rem; } .metric strong { display:block; margin-top:5px; font-size:1.5rem; } .metric.balance strong { color:var(--mint); } .period { max-width:190px; margin-left:auto; } .chart-wrap { position:relative; height:280px; margin-top:20px; } canvas { width:100%; height:100%; } .muted-button { background:var(--field); color:var(--ink); border:1px solid var(--line); }
    @media (max-width:520px) { main { padding:40px 20px 48px; } header { display:block; } .fields { grid-template-columns:1fr; gap:14px; } section { box-shadow:5px 5px 0 #29251e; } input[type="date"] { width:calc(100% - 12px); } .metrics { grid-template-columns:1fr; } .period { max-width:none; margin:0 0 16px; } .chart-wrap { height:220px; } }
  </style>
</head>
<body><main><header><div><h1>Money<br>Tracker</h1><p class="intro">A clear view of money in and money out.</p></div></header>
  <nav class="tabs" aria-label="Main views"><button class="tab active" data-view="overview">Overview</button><button class="tab" data-view="purchases">Purchases</button><button class="tab" data-view="income">Income</button></nav>
  <section id="overview" class="view active"><div class="fields"><label>Show<select id="period"><option value="day">Today</option><option value="week" selected>This week</option><option value="month">This month</option><option value="year">This year</option></select></label></div><div class="metrics"><div class="metric"><span>Spent</span><strong id="spent">$0.00</strong></div><div class="metric"><span>Earned</span><strong id="earned">$0.00</strong></div><div class="metric balance"><span>Balance</span><strong id="balance">$0.00</strong></div></div><div class="chart-wrap"><canvas id="chart" aria-label="Income and spending chart"></canvas></div><p class="intro" id="chart-empty">No entries for this period yet.</p></section>
  <section id="purchases" class="view"><form id="purchase-form"><div class="fields"><label>Date<input name="date" type="date" required></label><label>Amount<input name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required></label></div><div class="fields"><label>What did you buy?<input name="item" autocomplete="off" placeholder="Coffee and sandwich" required></label><label>Store<input name="store" autocomplete="organization" placeholder="Grocery store" required><select id="store-history" class="store-history"><option value="">Previous stores</option></select></label></div><div class="fields"><label>Category<select name="category"><option>General</option><option>Food</option><option>Transport</option><option>Home</option><option>Health</option><option>Fun</option></select></label><label>Notes<input name="notes" autocomplete="off" placeholder="Optional"></label></div><button type="submit">Add purchase</button><div class="status" id="status" role="status"></div></form><div class="recent"><h2>Recent purchases</h2><div id="recent-list"><p class="intro">Loading...</p></div></div></section>
  <section id="income" class="view"><form id="income-form"><div class="fields"><label>Date<input name="date" type="date" required></label><label>Amount<input name="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required></label></div><label>Where did it come from?<input name="source" autocomplete="organization" placeholder="Paycheck, freelance, refund" required></label><label>Notes<input name="notes" autocomplete="off" placeholder="Optional"></label><button type="submit">Add income</button><div class="status" id="income-status" role="status"></div></form></section>
  </main><script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbydnUHEElqkIZW-3RL94Li4Xa0C34RaGN5fdh32hWTdMMT5PMM5IpRlusuEdvAeP0Vi/exec';
    const form = document.querySelector('#purchase-form'), incomeForm = document.querySelector('#income-form'), status = document.querySelector('#status'), incomeStatus = document.querySelector('#income-status'), recentList = document.querySelector('#recent-list');
    const localDate = () => { const now = new Date(); return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; };
    form.date.value = localDate(); incomeForm.date.value = localDate();
    const money = value => Number(value || 0).toLocaleString(undefined, { style: 'currency', currency: 'USD' });
    const escapeHtml = value => { const div = document.createElement('div'); div.textContent = value || ''; return div.innerHTML; };
    let entries = [];
    function render(rows) { recentList.innerHTML = rows.length ? rows.map(row => `<div class="purchase"><div><strong>${escapeHtml(row.Item)}</strong><small>${escapeHtml(row.Store)} - ${escapeHtml(row.Date)} - ${escapeHtml(row.Time)} - ${escapeHtml(row.Category)}</small></div><span class="price">${money(row.Amount)}</span></div>`).join('') : '<p class="intro">No purchases yet.</p>'; }
    function renderStores(stores) { document.querySelector('#store-history').innerHTML = '<option value="">Previous stores</option>' + (stores || []).map(store => `<option value="${escapeHtml(store)}">${escapeHtml(store)}</option>`).join(''); }
    document.querySelector('#store-history').addEventListener('change', event => { if (event.target.value) form.store.value = event.target.value; event.target.value = ''; });
    function callApi(params) { return new Promise((resolve, reject) => { const callback = `callback${Date.now()}`; const script = document.createElement('script'); window[callback] = data => { delete window[callback]; script.remove(); resolve(data); }; script.onerror = () => reject(new Error('Could not reach the spreadsheet.')); script.src = `${API_URL}?${new URLSearchParams({ ...params, callback })}`; document.body.append(script); }); }
    function dateValue(value) { const parts = String(value || '').split(/[\/-]/).map(Number); if (parts.length === 3) return parts[0] > 1000 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date(parts[2], parts[0] - 1, parts[1]); return new Date(value); }
    function periodStart(period) { const now = new Date(); if (period === 'day') return new Date(now.getFullYear(), now.getMonth(), now.getDate()); if (period === 'week') { const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()); start.setDate(start.getDate() - start.getDay()); return start; } if (period === 'month') return new Date(now.getFullYear(), now.getMonth(), 1); return new Date(now.getFullYear(), 0, 1); }
    function drawChart() { const canvas = document.querySelector('#chart'), wrap = canvas.parentElement, width = wrap.clientWidth, height = wrap.clientHeight, ratio = window.devicePixelRatio || 1; canvas.width = width * ratio; canvas.height = height * ratio; const context = canvas.getContext('2d'); context.scale(ratio, ratio); const start = periodStart(document.querySelector('#period').value), period = document.querySelector('#period').value, filtered = entries.filter(entry => dateValue(entry.date) >= start); const groups = {}; filtered.forEach(entry => { const d = dateValue(entry.date); const key = period === 'day' ? 'day' : period === 'week' ? `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` : period === 'year' ? `${d.getMonth()}` : `${d.getDate()}`; groups[key] ||= { income: 0, spend: 0 }; groups[key][entry.type === 'Income' ? 'income' : 'spend'] += entry.amount; }); const keys = period === 'day' ? ['day'] : period === 'week' ? Array.from({ length: 7 }, (_, index) => { const day = new Date(start); day.setDate(start.getDate() + index); return `${day.getFullYear()}-${day.getMonth()}-${day.getDate()}`; }) : period === 'year' ? Array.from({ length: 12 }, (_, index) => `${index}`) : Array.from({ length: new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate() }, (_, index) => `${index + 1}`); const max = Math.max(1, ...keys.map(key => Math.max(groups[key]?.income || 0, groups[key]?.spend || 0))); const pad = { top: 12, right: 12, bottom: 28, left: 42 }, chartWidth = width - pad.left - pad.right, chartHeight = height - pad.top - pad.bottom; context.strokeStyle = '#3a403c'; context.fillStyle = '#9ba39e'; context.font = '11px sans-serif'; context.beginPath(); context.moveTo(pad.left, pad.top); context.lineTo(pad.left, height - pad.bottom); context.lineTo(width - pad.right, height - pad.bottom); context.stroke(); keys.forEach((key, index) => { const x = pad.left + (index / Math.max(1, keys.length - 1)) * chartWidth; const incomeY = height - pad.bottom - ((groups[key]?.income || 0) / max) * chartHeight; const spendY = height - pad.bottom - ((groups[key]?.spend || 0) / max) * chartHeight; context.fillStyle = '#a8d8c1'; context.beginPath(); context.arc(x, incomeY, 4, 0, Math.PI * 2); context.fill(); context.fillStyle = '#ed684d'; context.beginPath(); context.arc(x, spendY, 4, 0, Math.PI * 2); context.fill(); if (index % Math.max(1, Math.floor(keys.length / 6)) === 0) { context.fillStyle = '#9ba39e'; context.fillText(period === 'year' ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(key)] : period === 'day' ? 'Today' : period === 'week' ? ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][index] : key, x - 12, height - 8); } }); document.querySelector('#chart-empty').style.display = filtered.length ? 'none' : 'block'; }
    function renderOverview() { const start = periodStart(document.querySelector('#period').value), filtered = entries.filter(entry => dateValue(entry.date) >= start), spent = filtered.filter(entry => entry.type !== 'Income').reduce((sum, entry) => sum + entry.amount, 0), earned = filtered.filter(entry => entry.type === 'Income').reduce((sum, entry) => sum + entry.amount, 0); document.querySelector('#spent').textContent = money(spent); document.querySelector('#earned').textContent = money(earned); document.querySelector('#balance').textContent = money(earned - spent); drawChart(); }
    async function loadData() { try { const result = await callApi({}); if (result.error) throw new Error(result.error); entries = result.entries || []; render(result.rows || []); renderStores(result.stores); renderOverview(); } catch (error) { recentList.innerHTML = `<p class="intro error">${error.message}</p>`; } }
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => { document.querySelectorAll('.tab,.view').forEach(element => element.classList.remove('active')); tab.classList.add('active'); document.querySelector(`#${tab.dataset.view}`).classList.add('active'); if (tab.dataset.view === 'overview') drawChart(); }));
    document.querySelector('#period').addEventListener('change', renderOverview); window.addEventListener('resize', drawChart);
    async function submitForm(event, target, action, message) { event.preventDefault(); const button = target.querySelector('button'), targetStatus = target.querySelector('.status'); button.disabled = true; targetStatus.className = 'status'; targetStatus.textContent = 'Saving...'; try { const result = await callApi({ ...Object.fromEntries(new FormData(target)), action }); if (result.error) throw new Error(result.error); targetStatus.className = 'status success'; targetStatus.textContent = message; target.reset(); target.date.value = localDate(); await loadData(); } catch (error) { targetStatus.className = 'status error'; targetStatus.textContent = error.message; } finally { button.disabled = false; } }
    form.addEventListener('submit', event => submitForm(event, form, 'add', 'Purchase added.')); incomeForm.addEventListener('submit', event => submitForm(event, incomeForm, 'income', 'Income added.')); loadData();
  </script>
</body></html>
